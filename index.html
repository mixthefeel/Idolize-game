function mkrk3(){const pv={};S.rk.forEach((x,i)=>pv[x.n]=i);const lk=shuf(S.rk.map(x=>x.n)).slice(0,3);S.rk=S.rk.map(x=>({...x,v:Math.round(x.v*rnd(.92,1.14)+(lk.includes(x.n)?rnd(6000,12000):0)+(x.me?S.pop*80+(S.hm-50)*40+(S.img||0)*100:0))})).sort((a,b)=>b.v-a.v);S.rk.forEach((x,i)=>x.d=pv[x.n]-i);S.stage='done3';save();V='rank';draw()}
const tier=(x,a,b,t)=>x>=a?t[0]:x>=b?t[1]:t[2];
function asgT(mm){const a={},un=[...mm];POS6.slice(0,mm.length).forEach(p=>{const b=un.map(i=>[su(i,p),i]).sort((x,y)=>y[0]-x[0])[0][1];a[b]=p;un.splice(un.indexOf(b),1)});return a}
function mkpq(){const T=S.tm[S.mt],mm=tmm(T).filter(i=>i!='me'),w=shuf(mm),nv=[...mm].sort((a,b)=>sv(a)-sv(b))[0],a=w[0],b=w[1]||w[0],c=w[2]||w[0],d=w[3]||w[1]||w[0];
S.pq=[{id:nv,t:`${nm(nv)} gemetar di belakang panggung dan hampir menangis menjelang giliran tim.`,o:[['Menenangkannya dengan napas dalam dan genggaman tangan',[7,2,2,2]],['Mengingatkan bahwa semua sudah berlatih keras',[3,1,1,1]],['Fokus pada persiapanmu sendiri',[-2,4,0,-1]]]},
{id:a,t:`${nm(a)} dan ${nm(b)} berdebat soal siapa yang menutup bagian bridge, dan suara mereka mulai meninggi.`,o:[['Menengahi dan mengusulkan pembagian bergantian',[7,3,2,2]],['Memihak salah satu',[-3,1,1,-2]],['Meminta mereka tenang dan menyerahkan ke leader',[2,2,1,0]]]},
{id:c,t:`${nm(c)} menyalahkan ${nm(d)} atas kesalahan di gladi bersih, dan ruang tunggu mendadak canggung.`,o:[['Mengakui bagianmu juga belum sempurna',[6,3,2,3]],['Diam dan menghindar',[-1,0,0,-1]],[`Ikut menyoroti kesalahan ${nm(d)}`,[-6,-4,2,-3]]]},
{id:null,t:`Seorang staf memberi tahu bahwa kamera akan lebih sering menyorot posisimu sebagai ${S.pos}. Jantungmu berdebar.`,o:[['Tetap natural dan jadi diri sendiri',[2,3,0,3]],['Memikirkan cara tampil semenarik mungkin',[0,2,0,2]],['Panik dan overthinking',[-2,-2,0,-3]]]}]}
function startE4(){S.stage='e4';S.s4='ann';S.pr3=0;S.rd=0;mkpq();save();go('eps')}
function pp(i){const q=S.pq[S.pr3],e=q.o[i][1];S.hm=cl(S.hm+e[0]);S.rd+=e[1];S.pop+=e[2];S.img=(S.img||0)+e[3];if(q.id){const r=rel(q.id);r[0]=cl(r[0]+e[0]);if(e[0]<0)r[1]=cl(r[1]+4)}S.pr3++;if(S.pr3>=4){calc4();S.s4='perf'}save();draw()}
function calc4(){const pr={};S.rk.forEach((x,i)=>pr[x.n]=i);const scr={Leader:1.4,Visual:1.3,'Main Vocal':1.3,Rapper:1.1,'Main Dancer':1.1,'Sub Vocal':.8}[S.asg.me]||1;
const info=S.tm.map((t,ti)=>{const mm=tmm(t),hm=ti==S.mt?S.hm:rnd(40,75),q=mm.reduce((a,i)=>a+sv(i),0)/mm.length*.55+hm*.25+rnd(-6,6)+(tfit(t,t.song)-55)*.25+(ti==S.mt?S.rd:0),a=ti==S.mt?S.asg:asgT(mm);
const mv=mm.map(i=>{const x=S.rk.find(y=>y.n==nm(i)),b=a[i]=='Visual'?4000:a[i]=='Main Vocal'?2000:a[i]=='Leader'?1500:0;return{n:nm(i),v:Math.round(x.v*rnd(.92,1.1)+(q-45)*400+rnd(-2000,6000)+b+(i=='me'?S.pop*100+(S.hm-50)*50+S.rd*60+(S.img||0)*120+scr*(S.img||0)*70:0))}});
return{ti,q,mv,tot:mv.reduce((s,m)=>s+m.v,0)}});
info.forEach(x=>x.avg=x.tot/x.mv.length);const win=info.map(x=>x.ti).sort((a,b)=>info[b].avg-info[a].avg);info[win[0]].mv.forEach(m=>m.v+=20000);const t2=info[win[1]].mv.reduce((a,m)=>m.v>a.v?m:a);t2.v+=20000;const bn=t2.n;
const all={};info.forEach(x=>x.mv.forEach(m=>all[m.n]=m.v));
const fl=S.rk.map(x=>({n:x.n,ag:x.ag,me:x.me,v:all[x.n]})).sort((a,b)=>b.v-a.v);fl.forEach((x,i)=>{x.d=pr[x.n]-i;x.e=i>=20});S.r4={info,win,bn,rk:fl}}
function e4(){const s=S.s4,r=S.r4;if(S.stage=='out')return ending();
const T=S.tm[S.mt],m=tmm(T);
if(s=='ann')return `<h2>EP04 Persiapan Group Battle</h2><div class="card">Hari pertunjukan tiba. Host menegaskan aturan: kelima tim tampil sekaligus dan dinilai dari rata-rata suara penonton per anggota. Tim peringkat 1: setiap anggota mendapat <b>+20.000 suara</b>. Tim peringkat 2: hanya trainee dengan suara tertinggi di tim itu yang mendapat <b>+20.000 suara</b>. Setelah itu, 7 peserta dengan peringkat suara publik terendah tereliminasi dan tersisa 20 orang.</div><div class="card">Timmu: <b>Tim ${S.mt+1}</b> membawakan "${T.song}" (${(SGI[T.song]||['',''])[0]}). Kamu tampil sebagai ${S.pos}.</div>${chips(m)}<button class="b" onclick="S.s4='prep';save();draw()">Menuju backstage</button>`;
if(s=='prep'){const q=S.pq[S.pr3];return `<h2>Di Balik Panggung</h2><p class="mut">Momen ${S.pr3+1} dari 4 · kekompakan ${Math.round(S.hm)}</p><div class="card">${q.t}</div>${q.id?chips([q.id]):''}`+q.o.map((o,i)=>`<button class="b o" onclick="pp(${i})">${o[0]}</button>`).join('')}
if(s=='perf'){const u=r.info[S.mt],vs=m.find(i=>S.asg[i]=='Visual'),best=r.info.reduce((a,b)=>b.q>a.q?b:a).ti,sg=SGI[T.song]||['',''];return `<h2>Penampilan Group Battle</h2><div class="card"><h3>Tim ${S.mt+1}: "${T.song}"</h3><p class="mut">Lagu asli: ${sg[0]} · ${sg[1]}</p><p>Lampu padam, intro berbunyi, dan timmu naik panggung. ${vs?E(nm(vs))+' mencuri sorotan kamera. ':''}${u.q>=60?'Sinkronisasi terjaga dan konsep lagu tersampaikan dengan kuat.':u.q>=50?'Ada beberapa goyah kecil, tetapi tim menyelesaikan lagu dengan solid.':'Beberapa bagian goyah dan konsep lagu belum terasa menyatu.'} Sebagai ${S.pos}, ${su('me',S.pos)>=55?'bagianmu tampil bersih.':'bagianmu terdengar agak rapuh.'}</p></div>`+r.info.filter(x=>x.ti!=S.mt).map(x=>`<div class="row" style="display:block"><b>Tim ${x.ti+1}</b> "${S.tm[x.ti].song}" (${(SGI[S.tm[x.ti].song]||[''])[0]}): ${x.ti==best?'ditayangkan penuh, penampilan paling solid malam ini.':'ditayangkan dalam sorotan momen terbaik.'}</div>`).join('')+`<button class="b" onclick="S.s4='mentor';save();draw()">Komentar mentor</button>`}
if(s=='mentor'){const u=r.info[S.mt],av=k=>m.reduce((a,i)=>a+gx(i)[k],0)/m.length;return `<h2>Komentar Mentor</h2><div class="card">Gazz: stabilitas vokal ${tier(av('v'),65,50,['sangat stabil','cukup stabil','goyah di nada tinggi'])}.<br>Baek Seoyeon: sinkronisasi dance ${tier(av('d')*.7+S.hm*.3,60,48,['rapi','cukup rapi','kurang serempak'])}.<br>The Light: rap ${tier(Math.max(...m.map(i=>gx(i).r)),70,50,['tajam dan penuh flow','cukup solid','kurang bertenaga'])}.<br>Yoon Chaerin: ekspresi dan penguasaan panggung ${tier(av('vi')*.6+u.q*.4,65,52,['memikat kamera','cukup meyakinkan','masih kaku'])}, dan kesesuaian dengan konsep "${T.song}" ${tier(tfit(T,T.song),58,48,['terasa pas','cukup pas','kurang pas'])}.<br><br>Untuk posisimu sebagai ${S.pos}: ${su('me',S.pos)>=55?'kamu memenuhi tuntutan posisinya.':'masih ada jarak dengan tuntutan posisinya.'}</div><button class="b" onclick="S.s4='vote';save();draw()">Voting penonton</button>`}
if(s=='vote')return `<h2>Voting Penonton</h2><div class="card">Penonton memberi suara untuk trainee individual. Kelima tim dinilai sekaligus dari rata-rata suara per anggota. Tim peringkat 1: +20.000 suara untuk setiap anggota. Tim peringkat 2: +20.000 suara hanya untuk trainee tertinggi di tim itu.</div>`+r.win.map((t,k)=>`<div class="row ${t==S.mt?'me':''}"><b>${k+1}</b><div class="n">Tim ${t+1} "${S.tm[t].song}"<span>rata-rata suara per anggota</span></div>${k==0?'<span class="gd">JUARA</span>':k==1?'<span class="gd">2</span>':''}<b>${Math.round(r.info[t].avg).toLocaleString('id-ID')}</b></div>`).join('')+`<div class="card">${r.win[0]==S.mt?'Timmu juara! Seluruh anggota mendapat +20.000 suara.':r.win[1]==S.mt?(r.bn==S.p.stage?'Timmu peringkat 2 dan kamu trainee dengan suara tertinggi di timmu: +20.000 suara untukmu.':'Timmu peringkat 2. Benefit hanya untuk '+E(r.bn)+', trainee dengan suara tertinggi di tim.'):'Timmu tidak mendapat benefit kali ini.'}</div><button class="b" onclick="S.s4='recap';save();draw()">Rekapitulasi</button>`;
if(s=='recap'){const mi=r.rk.findIndex(x=>x.me)+1,pc2=pubc(r.rk);return `<h2>Rekapitulasi</h2><div class="card">Host menampilkan hasil Group Battle dan perolehan suara individu. Kamu berada di peringkat <b>#${mi}</b> dengan ${r.rk[mi-1].v.toLocaleString('id-ID')} suara.</div>${pc2.length?'<div class="card"><h3>Komentar publik</h3>'+pc2.map(E).join('<br>')+'</div>':''}<button class="b" onclick="S.s4='elim';save();draw()">Studio eliminasi</button>`}
if(s=='elim'){const ou=r.rk.slice(20);return `<h2>Eliminasi Pertama</h2><div class="card">Tujuh peserta dengan suara publik terendah tereliminasi. Tersisa 20 orang.</div>`+r.rk.map((x,i)=>(i==20?'<div class="mut" style="text-align:center;margin:8px 0">garis eliminasi</div>':'')+`<div class="row ${x.me?'me':''}"><b>${i+1}</b><div class="n">${flagN(x.n)} ${E(x.n)}<span>${E(x.ag)}</span></div>${x.e?'<span class="gd">OUT</span>':''}<b>${x.v.toLocaleString('id-ID')}</b></div>`).join('')+`<div class="card"><h3>Perpisahan</h3><p>${ou.slice(0,3).map((x,i)=>E(x.n)+': "'+['Terima kasih sudah bertarung bersama kalian.','Aku bangga bisa sampai sini.','Tolong jaga satu sama lain.'][i]+'"').join('<br>')}<br><span class="mut">Peserta lain berpamitan singkat di belakang panggung.</span></p></div><button class="b" onclick="fin4()">Lanjut</button>`}}
function fin4(){const rk=S.r4.rk;S.rk=rk;S.stage=rk.findIndex(x=>x.me)>=20?'out':'done4';save();if(S.stage=='out')go('eps');else{V='rank';draw()}}
function ending(){const me=S.rk.findIndex(x=>x.me)+1,en=Object.entries(S.rel).sort((a,b)=>b[1][0]-a[1][0])[0];return `<h2>Ending C: Eliminated Before Finale</h2><div class="card"><div class="big">Peringkat <b>#${me}</b></div><p>Namamu dipanggil di antara tujuh peserta yang meninggalkan program. Kamu berpamitan singkat dan berjalan keluar studio diiringi tepuk tangan teman-temanmu.${en?' '+nid(en[0]).n+' memelukmu paling lama.':''}</p><p>Perjalananmu di IDOLIZE berakhir di sini, tetapi penampilanmu dan hubungan yang kamu bangun akan diingat penonton. Peluang lain mungkin menunggu di luar sana.</p></div><div class="card"><h3>Ringkasan perjalanan</h3><p>Grade final: ${S.res.cls}<br>Center lagu tema: ${E(S.ctr.n)}<br>Posisi di tim: ${S.pos}<br>Sesi latihan: ${S.tn}</p></div><button class="b" onclick="again()">Main lagi</button>`}
function again(){try{localStorage.removeItem(KEY)}catch(e){}S=null;V='home';draw()}
function result(r,ti){return `<h2>${ti}</h2><div class="card"><div class="big">Grade <b>${r.cls}</b></div><p>Peringkat ${r.rank} dari ${r.list.length}. Nilai ${r.E.toFixed(1)}</p><p class="mut">${r.Q==null?'Penilaian penampilan murni di depan mentor.':`Quiz ${r.Q} · Performa ${r.P.toFixed(0)} · Persiapan ${r.Sc.toFixed(0)} · Sikap ${r.T.toFixed(0)}<br>Grade awal ${S.res1.cls}, grade sekarang ${r.cls}`}</p></div><div class="card"><h3>Komentar mentor</h3><p>${r.cm}</p></div>`+[...'ABCDF'].map(L=>{const g=r.list.map((x,i)=>[x,i]).filter(a=>GR[a[1]]==L);if(!g.length)return'';return `<div class="chd">Kelas ${L}</div><div class="pg">${g.map(([x,i])=>{const o=r.Q==null?-1:S.res1.list.findIndex(y=>y.id==x.id),a=o<0?'':GR[i]<GR[o]?' ▲':GR[i]>GR[o]?' ▼':' –';return pcd(x.id,`<span>${x.E.toFixed(1)}${a}</span>`)}).join('')}</div>`}).join('')}
draw();
</script></body></html>
