if(s=='ann')return `<h2>EP09 Pengumuman Pemenang</h2><div class="card">Hasil Concept Stage diumumkan. Tim peringkat 1, "${E(S.tm[S.t8[0].i].song)}", mendapat benefit: +25.000 suara untuk setiap anggota. Dari tim peringkat 2, "${E(S.tm[S.t8[1].i].song)}", hanya trainee dengan suara tertinggi di timnya, ${E(nm(R.s))}, yang mendapat +25.000 suara.</div>${chips([...R.w,R.s])}<button class="b" onclick="S.s5='act';save();draw()">Segmen kelas</button>`;
for(const k of ['act','mku','plk']){const sg=SEG[k],nk={act:'mku',mku:'plk',plk:'elimgo'}[k];if(s==k)return `<h2>${sg[0]}</h2><div class="card">${sg[1]}</div>`+sg[2].map((o,i)=>`<button class="b o" onclick="segP('${k}',${i})">${o}</button>`).join('');
if(s==k+'r'){const r=S.sg9[k];return `<h2>Hasil ${sg[0]}</h2><div class="card">Tiga terbaik: ${r.top.map(i=>E(nm(i))).join(', ')}.${r.me?' Kamu masuk tiga besar!':''} Pemenang mendapat tambahan suara dari penonton.</div>${chips(r.top)}<button class="b" onclick="${nk=='elimgo'?'e9e()':`S.s5='${nk}';save();draw()`}">Lanjut</button>`}}
if(s=='elim')return eE();
if(s=='next')return `<h2>Misi Berikutnya: Debut Evaluation</h2><div class="card">Host mengumumkan misi terakhir sebelum final: Debut Evaluation. Sepuluh finalis akan membawakan lagu debut orisinal. Tim dan posisi akan ditentukan dari urutan rank.</div><button class="b" onclick="S.stage='done9';save();V='rank';draw()">Pengumuman rank</button>`}
function e9e(){vup(()=>45,0);mkEl(10,9)}
const SL=['Main Vocal','Sub Vocal 1','Sub Vocal 2','Main Rapper','Sub Rapper 1'],SN={'BREAK THE LIMIT':'hentakan EDM, vokal tinggi, rap cepat di bridge','RUN IT UP':'bass funky, chant mudah ditiru, drop dance liar'};
const sfit=(id,p)=>{const x=gx(id),k=/Vocal/.test(p)?'v':'r';return x[k]*(/Main/.test(p)?1:.8)+(x.d+x.vi)/2*.15};
function freeBest(id){let b=null;for(const sg in S.sl)S.sl[sg].forEach((o,pi)=>{if(o)return;const sc=sfit(id,SL[pi])+rnd(-3,3);if(!b||sc>b[2])b=[sg,pi,sc]});return b}
function place(id,sg,pi){const o=S.sl[sg][pi];S.sl[sg][pi]=id;if(o){const f=freeBest(o);if(f){S.sl[f[0]][f[1]]=o;S.lg10.push(`${nm(id)} menggantikan ${nm(o)} sebagai ${SL[pi]} di ${sg}. ${nm(o)} pindah ke ${SL[f[1]]} di ${f[0]}.`);if(o=='me')jr('Dipindahkan ke '+SL[f[1]]+' di '+f[0]+'.')}}else S.lg10.push(`${nm(id)} memilih ${SL[pi]} di ${sg}.`)}
function p10(){while(S.oi<S.ord10.length){const id=S.ord10[S.oi];if(id=='me'){S.s5='pick10';save();draw();return}let b=null;for(const sg in S.sl)S.sl[sg].forEach((o,pi)=>{const f=sfit(id,SL[pi]),sc=f+rnd(-6,6)+(o?(f>sfit(o,SL[pi])+3?-1:-20):0);if(!b||sc>b[0])b=[sc,sg,pi]});place(id,b[1],b[2]);S.oi++}
S.tm=Object.keys(S.sl).map(sg=>({song:sg,cat:'Debut',m:S.sl[sg].slice(),c:null,pl:SL.slice()}));S.mt=S.tm.findIndex(t=>t.m.includes('me'));S.asg={};S.tm[S.mt].m.forEach((id,i)=>S.asg[id]=SL[i]);S.pos=S.asg.me;jr('Posisi debut evaluation: '+S.pos+' di '+S.tm[S.mt].song+'.');S.s5='team10';save();draw()}
function startE10(){S.stage='e10';S.s5='ann';S.sl={'BREAK THE LIMIT':Array(5).fill(null),'RUN IT UP':Array(5).fill(null)};S.ord10=S.rk.map(x=>idOf(x.n)).reverse();S.oi=0;S.lg10=[];S.hm=50;S.pf=[];S.q5=[];S.ev=null;save();go('eps')}
function pk10(sg,pi){place('me',sg,pi);S.oi++;p10()}
function posres10(){const T=S.tm[S.mt],mm=tmm(T),a={};let un=[...mm],me=null;['Leader','Center'].forEach(r=>{let w=null;if(!me&&S.pf.includes(r)){const cp=un.filter(i=>i!='me').map(i=>su(i,r));if(!cp.length||su('me',r)>=Math.max(...cp)-6){w='me';me=r}}if(!w)w=un.filter(i=>i!='me'||!me).map(i=>[su(i,r),i]).sort((x,y)=>y[0]-x[0])[0][1];a[w]=(a[w]?a[w]+' / ':'')+r;un=un.filter(i=>i!=w)});
S.rl10=a;S.asg={};mm.forEach((id,i)=>S.asg[id]=T.pl[i]+(a[id]?' / '+a[id]:''));S.pos=S.asg.me;if(/Leader/.test(S.pos))S.hm+=6;jr('Peran di tim debut: '+S.pos+'.');S.s5='posr10';save();draw()}
const INT=[['Apa alasan terbesarmu bertahan sampai sini?',[['Orang-orang yang mendukungku',[2,1]],['Mimpi yang belum selesai',[3,2]],['Aku ingin membuktikan diri',[1,3]]]],['Siapa yang paling berpengaruh dalam perjalananmu?',[['Teman sekamarku',[3,1]],['Mentor yang keras padaku',[2,2]],['Diriku yang dulu',[2,1]]]],['Apa pesanmu untuk penonton?',[['Terima kasih sudah percaya padaku',[3,2]],['Lihat aku sampai akhir',[2,3]],['Jangan lupakan semua trainee',[3,1]]]]];
function e10(){if(S.ev)return evView();const s=S.s5,T=S.tm&&S.tm[S.mt];
if(s=='ann')return `<h2>EP10 Debut Evaluation</h2><div class="card">Host memperkenalkan dua lagu debut orisinal dengan kuota 5-5: <b>BREAK THE LIMIT</b> (${SN['BREAK THE LIMIT']}) dan <b>RUN IT UP</b> (${SN['RUN IT UP']}). Keduanya bergenre dance-pop, EDM, dan hip-hop. Sepuluh finalis memilih lagu dan posisi secara berurutan dari rank 10 sampai rank 1. Posisi: Main Vocal, Sub Vocal 1, Sub Vocal 2, Main Rapper, Sub Rapper 1. Jika posisi yang diincar sudah terisi, trainee dengan rank di atasnya boleh memindahkan trainee sebelumnya ke posisi atau lagu lain.</div><button class="b" onclick="p10()">Mulai pemilihan</button>`;
if(s=='pick10')return `<h2>Giliranmu memilih</h2><div class="card">Kamu di urutan ke-${S.oi+1}. ${S.lg10.slice(-3).map(E).join('<br>')||'Kamu memilih paling awal.'}<br><span class="mut">Memilih slot yang sudah terisi akan memindahkan penghuninya.</span></div>`+Object.keys(S.sl).map(sg=>`<div class="ah">${sg}</div>`+S.sl[sg].map((o,pi)=>`<button class="b o" onclick="pk10('${sg}',${pi})">${SL[pi]}<small>${o?'diisi '+E(nm(o))+' (akan dipindahkan)':'kosong'} · kecocokanmu ${Math.round(sfit('me',SL[pi]))}</small></button>`).join('')).join('');
if(s=='team10')return `<h2>Tim Debut Evaluation</h2><div class="card mut">${S.lg10.slice(-8).map(E).join('<br>')}</div>`+S.tm.map((t,i)=>`<div class="ah">${t.song}${i==S.mt?' (timmu)':''}</div><div class="pg">${t.m.map((id,k)=>pcd(id,`<span><b style="display:inline">${SL[k]}</b></span>`)).join('')}</div>`).join('')+`<button class="b" onclick="S.s5='disc10';save();draw()">Diskusi leader dan center</button>`;
if(s=='disc10')return `<h2>Diskusi Leader dan Center</h2><div class="card">Tim "${T.song}" memilih Leader dan Center. Pilih maksimal 2 peran yang kamu incar. Hasilnya disesuaikan skill, karakter, dan usia (untuk Leader).</div>${chips(tmm(T).filter(i=>i!='me'))}`+['Leader','Center'].map(p=>{const k=S.pf.indexOf(p);return `<button class="b ${k>=0?'':'o'}" onclick="tp('${p}')">${p}${k>=0?' · pilihan '+(k+1):''}<small>kecocokanmu ${Math.round(su('me',p))}</small></button>`}).join('')+`<button class="b" onclick="posres10()">Ajukan peran</button>`;
if(s=='posr10')return `<h2>Hasil Peran</h2><div class="card">Peranmu di tim: <b>${S.pos}</b>.</div>`+tmm(T).map(i=>`<div class="row ${i=='me'?'me':''}"><div class="n">${flagN(nm(i))} ${E(nm(i))}</div><b>${S.asg[i]}</b></div>`).join('')+`<button class="b" onclick="S.nx='q5';mkcf()">Latihan grup</button>`;
if(s=='prac')return pracV();
if(s=='q5'){const Q=q5s(T),q=Q[S.q5.length];return `<h2>Mission Quiz</h2><p class="mut">Pertanyaan ${S.q5.length+1} dari 2 · berdasarkan lagu debut dan posisimu</p><div class="card"><h3>${q[0]}</h3></div>`+q[1].map((o,i)=>`<button class="b o" onclick="a5(${i})">${o}</button>`).join('')}
if(s=='ment'){const mm=tmm(T),av=k=>mm.reduce((a,i)=>a+gx(i)[k],0)/mm.length;return `<h2>Evaluasi Mentor</h2><div class="card">Untuk timmu, "${E(T.song)}":<br>Gazz: vokal ${tier(av('v'),60,45,['stabil','cukup stabil','goyah'])}.<br>Baek Seoyeon: dance ${tier(av('d'),60,45,['rapi','cukup rapi','kurang presisi'])}.<br>The Light: rap ${tier(av('r'),60,45,['tajam','cukup solid','kurang bertenaga'])}.<br>Yoon Chaerin: ekspresi ${tier(av('vi'),60,45,['memikat','cukup meyakinkan','masih kaku'])}.<br>Nilai mission quiz-mu: ${S.q5s??0}.</div><button class="b" onclick="m10x()">Lanjut ke rekaman studio</button>`}
if(s=='rec')return `<h2>Rekaman di Studio</h2><div class="card">Tim "${T.song}" masuk studio rekaman. Lampu merah menyala dan produser meminta take pertama. Bagaimana kamu merekam bagianmu?</div>${chips(tmm(T).filter(i=>i!='me'))}`+['Mengulang take sampai terasa sempurna','Merekam natural dalam sedikit take','Meminta masukan teman setim sebelum take'].map((o,i)=>`<button class="b o" onclick="rc10(${i})">${o}</button>`).join('');
if(s=='mkt')return `<h2>Liburan Tim ke Pasar</h2><div class="card">Setiap tim berlibur ke pasar tradisional dan jajan street food khas. Suasana mencair setelah berminggu-minggu tegang.</div>${chips(tmm(T).filter(i=>i!='me'))}<button class="b" onclick="S.evq=[mkpk('food'),mkpk('food'),mkpk('hang')];S.ev=S.evq.shift();S.aft='e10m';draw()">Jalan-jalan di pasar</button>`;
if(s=='intv'){if(S.iq==null)S.iq=0;if(S.iq<3){const q=INT[S.iq];return `<h2>Interview Trainee</h2><div class="card"><h3>${q[0]}</h3></div>`+q[1].map((o,i)=>`<button class="b o" onclick="iv(${i})">${o[0]}</button>`).join('')}
const a=shuf(S.rk.map(x=>idOf(x.n)).filter(i=>i!='me')).slice(0,3),Q=['Aku datang bukan untuk menonton, aku datang untuk bertarung.','Aku belajar banyak dari teman-temanku di sini.','Aku ingin tersenyum sampai akhir.','Aku masih tidak percaya aku sampai sini.'];return `<h2>Interview Para Finalis</h2><div class="card">${a.map((i,k)=>E(nm(i))+': "'+Q[(i.length+k)%4]+'"').join('<br>')}</div>${chips(a)}<button class="b" onclick="mk10()">Pengumuman rank</button>`}}
function m10x(){S.s5='rec';save();draw()}
function rc10(i){const o=[[8,2,0],[-4,2,1],[2,1,3]][i],m=shuf(tmm(S.tm[S.mt]).filter(x=>x!='me'))[0];S.cfd=cl((S.cfd??50)+o[0]);S.img=(S.img||0)+o[1];if(m&&i==2)rel(m)[0]=cl(rel(m)[0]+8);S.hm=cl(S.hm+o[2]);jr('Rekaman: '+['mengulang take','take natural','meminta masukan tim'][i]+'.');S.s5='mkt';save();draw()}
function iv(i){const e=INT[S.iq][1][i][1];S.cfd=cl((S.cfd??50)+e[0]*2);S.img=(S.img||0)+e[1];S.iq++;if(S.iq==3)jr('Interview finalis selesai.');save();draw()}
function mk10(){vup(qteam,300);hist('EP10',S.rk);S.stage='done10';S.iq=null;save();V='rank';draw()}
function startE11(){S.stage='e11';S.s5='open';S.ev=null;S.e11=null;save();go('eps')}
function e11(){const s=S.s5,F=S.hist||[];
if(s=='open')return `<h2>EP11 Live Final IDOLIZE</h2><div class="card">Lampu stadion menyala. Host membuka siaran langsung final: "Malam ini sepuluh finalis akan menampilkan lagu debut mereka, dan penonton menentukan tujuh member debut."</div><button class="b" onclick="S.s5='recap';save();draw()">Lanjut</button>`;
if(s=='recap'){const r1=S.res1,r2=S.res,best=F.length?F.reduce((a,b)=>b.r<a.r?b:a):null,dr=F.length>1?F.reduce((a,b,i,l)=>i&&b.r-l[i-1].r>(a.d||0)?{d:b.r-l[i-1].r,l:b.l}:a,{}):{};return `<h2>Recap Perjalanan</h2><div class="card">Layar raksasa memutar perjalanan sepuluh finalis sejak audisi.<br>Audisi: grade awal ${r1.cls}, peringkat ${r1.rank}.<br>Re-evaluasi: grade ${r2.cls}.<br>Center lagu tema: ${E(S.ctr.n)}.<br>${best?'Peringkat tertinggimu: #'+best.r+' ('+best.l+').<br>':''}${dr.l?'Penurunan terbesar terjadi di '+dr.l+'.<br>':''}Para trainee yang tersingkir di sepanjang jalan: ${(S.outs||[]).length} orang.</div>${chips(S.rk.map(x=>idOf(x.n)))}<button class="b" onclick="S.s5='grp';save();draw()">Penampilan bersama</button>`}
if(s=='grp')return `<h2>Penampilan Grup: Starlight</h2><div class="card">Sepuluh finalis membawakan lagu tema "Starlight" bersama-sama di panggung final. Fokus apa yang kamu bawa malam ini?</div>`+['Ketulusan dan senyum hangat','Energi penuh dan karisma panggung','Presisi dan ketenangan'].map((o,i)=>`<button class="b o" onclick="S.img=(S.img||0)+${[2,3,1][i]};S.cfd=cl((S.cfd??50)+${[4,3,5][i]});S.s5='f1';save();draw()">${o}</button>`).join('');
if(s=='f1'||s=='f2'){const k=s=='f1'?0:1,t=S.tm[k];if(!S.e11)S.e11=S.tm.map((t,ti)=>{const mm=tmm(t);return mm.reduce((a,i)=>a+sv(i),0)/mm.length*.5+tfit(t,t.song)*.2+(ti==S.mt?S.hm:rnd(40,75))*.15+(ti==S.mt?imgFit(t.song)+relA(mm):rnd(-3,3))+rnd(-8,8)});
if(k==S.mt&&S.p11==null)return `<h2>Final Stage ${k+1}: timmu</h2><div class="card">Tim "${t.song}" naik panggung membawakan lagu debut. Sebagai ${S.pos}, bagaimana kamu menampilkannya?</div>${chips(t.m)}`+TAC.map((x,i)=>`<button class="b o" onclick="S.p11=cl(avg(S.p.st,S.p.pos)+rnd(${x[2][0]},${x[2][1]})+((S.cfd??50)-50)*.1);S.img=(S.img||0)+[1,2,0][${i}];save();draw()">${x[0]}<small>${x[1]}</small></button>`).join('');
return `<h2>Final Stage ${k+1}</h2><div class="card">${k==S.mt?'Penampilan timmu selesai. ':''}Tim "${t.song}" membawakan lagu debut ${SN[t.song]}. ${S.e11[k]>=52?'Panggung terasa megah dan penonton bersorak.':'Ada momen goyah, tetapi tim berhasil menutupnya.'}</div>${chips(t.m)}<button class="b" onclick="S.p11=null;S.s5='${s=='f1'?'f2':'mnt'}';save();draw()">Lanjut</button>`}
if(s=='mnt')return `<h2>Komentar Mentor</h2><div class="card">Gazz: stabilitas vokal malam ini ${tier(sv('me'),60,45,['sangat baik','cukup baik','masih perlu diasah'])}.<br>Baek Seoyeon: sinkronisasi dance ${tier(S.e11[S.mt],52,44,['rapi','cukup rapi','kurang presisi'])}.<br>The Light: untuk rap dan karakter panggung, kalian semua sudah jauh berkembang.<br>Yoon Chaerin: kalian sudah pantas berdiri di panggung sebesar ini.<br><br>Tidak ada nilai mentor yang menggantikan suara publik di final ini.</div><button class="b" onclick="S.s5='vclose';save();draw()">Voting ditutup</button>`;
if(s=='vclose')return `<h2>Voting Final Ditutup</h2><div class="card">Host menjelaskan: suara final adalah 100% suara publik, yaitu akumulasi voting hingga hari ini ditambah voting langsung selama 60 menit sampai batas waktu ditutup. Tidak ada nilai mentor yang ikut dihitung.</div><button class="b" onclick="vup(id=>S.e11[S.tm.findIndex(t=>t.m.includes(id))],300);mkEl(7,11)">Mulai pengumuman ranking</button>`;
if(s=='elim')return eE()}
draw();
</script></body></html>
